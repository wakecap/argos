name: Deploy

# Ships wakecap/argos to production on WakeCap's EKS (us-east-2 prod), through
# the house deploy lane:
#
#   build-image  -> ECR wakecap/argos:production-<date>-<sha7>
#   dispatch     -> repository_dispatch to wakecap/infrastructure
#   infra repo   -> bot PR bumping terraform.auto.tfvars.json in
#                   terraform/aws/wakecap-main/us-east-2/prod/argos, plan
#                   safety, auto-merge, apply: the migrate Job runs first,
#                   then web and worker roll.
#
# The steps are the ones wakecap/actions build-image and dispatch-deploy run,
# written out with public actions: wakecap/actions is an internal repository,
# and GitHub does not let a public repository use actions from one (first run:
# "Unable to resolve action `wakecap/actions`, not found"). Keep the tag scheme
# (production-<date>-<sha7>) and the dispatch payload in step with them.
#
# The cluster side (settings, secrets, sizing) lives in that Terraform layer,
# not here. This repository holds no AWS deploy role: the only AWS credential
# CI uses is the org-wide ECR push role, and the dispatch token is minted from
# the wakecap-argos-dispatch GitHub App (contents:write on
# wakecap/infrastructure only). Its ID and key are the CI_APP_ID /
# CI_APP_PRIVATE_KEY secrets of the `production` environment, which only
# `main` can use. The org secrets of the same names are private-visibility
# and unreadable from this public repository.
#
# Off until the repository variable DEPLOY_ENABLED is "true": a merge skips
# the deploy rather than failing it. A repository variable, not an
# environment one, because a job's `if` is read before its environment.
#
# To roll back, run this workflow by hand with an older commit. That commit is
# rebuilt and only argos_image moves; argos_migrate_image stays, so the
# migrate Job does not rerun and the database stays as it is. knex refuses to
# run with code older than the migrations it has applied, and the older code
# normally works with the newer schema. Undoing a migration is a manual step.

permissions: {}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to deploy, for a rollback. Empty deploys the head of the branch.
        required: false
        type: string

# One deploy at a time: a second one waits instead of cancelling the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    # A fork of this repository has no registry to push to.
    if: github.repository == 'wakecap/argos' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.tag.outputs.image }}
    env:
      REGISTRY: 582053393120.dkr.ecr.us-west-2.amazonaws.com
      REPOSITORY: wakecap/argos

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Same scheme as wakecap/actions build-image: <env>-<UTC date>-<sha7>.
      # The ECR lifecycle rule keeps the last 10 `production-` images.
      - name: Name the image
        id: tag
        run: |
          SHORT_SHA="$(git rev-parse HEAD | cut -c1-7)"
          echo "image=${REGISTRY}/${REPOSITORY}:production-$(date -u +%Y%m%d)-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # The org-wide ECR push role; it trusts every wakecap/* repository.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::582053393120:role/github-actions-ecr-push
          aws-region: us-west-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Builds the Dockerfile's last stage, `runtime`, which is the app image.
      # ubuntu-latest is X86_64, which the EKS node selector expects.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dispatch:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    # No id-token: the dispatch uses a GitHub App token, not OIDC.
    permissions:
      contents: read

    steps:
      - name: Mint a token for wakecap/infrastructure
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: wakecap
          repositories: infrastructure

      # Same payload as wakecap/actions dispatch-deploy (grouped images mode).
      # A rollback bumps only argos_image, so the migrate Job does not rerun.
      - name: Dispatch the deploy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE: ${{ needs.build.outputs.image }}
          ROLLBACK: ${{ inputs.ref != '' && inputs.ref != null }}
        run: |
          set -euo pipefail
          if [ "$ROLLBACK" = "true" ]; then
            IMAGES=$(jq -cn --arg i "$IMAGE" '{argos_image: $i}')
          else
            IMAGES=$(jq -cn --arg i "$IMAGE" '{argos_image: $i, argos_migrate_image: $i}')
          fi
          jq -nc \
            --arg layer "aws/wakecap-main/us-east-2/prod/argos" \
            --argjson imgs "$IMAGES" \
            --arg did "$(uuidgen | tr '[:upper:]' '[:lower:]')" \
            '{event_type: "deploy-image", client_payload: {layer: $layer, images: $imgs, dispatch_id: $did}}' \
            > payload.json
          cat payload.json
          gh api -X POST repos/wakecap/infrastructure/dispatches --input payload.json
          echo "Dispatched. The deploy PR opens on branch deploy/aws/wakecap-main/us-east-2/prod/argos in wakecap/infrastructure."
