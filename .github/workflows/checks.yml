name: Checks

# Our tests, in place of upstream's CI workflow, which is disabled on this
# fork. The jobs are upstream's, with two differences:
# - S3 is a throwaway MinIO (.github/actions/start-s3) instead of the bucket in
#   Argos's own AWS account, and DynamoDB (the Deployments feature) is
#   DynamoDB Local instead of tables in that account.
# - Nothing is uploaded to argos-ci.com: upstream uploads screenshots of its own
#   UI there whenever CI is set, so the test commands run with CI unset and
#   pass Playwright the two options CI would turn on.

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# A new push to a pull request replaces the run in progress.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Any credentials do: the MinIO they open is made for the job and thrown away.
  AWS_ACCESS_KEY_ID: argos
  AWS_SECRET_ACCESS_KEY: argos-ci-only
  AWS_REGION: eu-west-1

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-deps

      - name: Build
        run: pnpm exec -- turbo run build --filter=\!@argos/frontend

      - name: Run static checks
        run: pnpm exec -- turbo run static-checks

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NODE_ENV: test
      TZ: UTC
      # Read by every S3 client the tests make, not only the app's.
      AWS_ENDPOINT_URL_S3: http://127.0.0.1:9000

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start S3
        uses: ./.github/actions/start-s3

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-deps

      - name: Build
        run: pnpm exec -- turbo run build --filter=\!@argos/frontend

      - name: Run unit tests
        run: pnpm run test:unit

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NODE_ENV: test
      TZ: UTC
      AWS_ENDPOINT_URL_S3: http://127.0.0.1:9000
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000

    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
      redis:
        image: redis:6-alpine
        ports:
          - 6380:6379
      postgres:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
      rabbit:
        # Keep in sync with docker-compose.yml and production (Amazon MQ 4.2).
        image: rabbitmq:4.2-alpine
        ports:
          - 5672:5672

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start S3
        uses: ./.github/actions/start-s3

      # The tables upstream defines in infra/lib/deployment-stack.ts, under the
      # `development` stage the tests run with. The app's DynamoDB client signs
      # for us-east-1, and DynamoDB Local keeps tables per region and key.
      - name: Create the DynamoDB tables
        run: |
          set -euo pipefail
          ddb() { aws dynamodb --endpoint-url "$DYNAMODB_ENDPOINT" --region us-east-1 "$@"; }
          for _ in $(seq 1 30); do
            if ddb list-tables > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          ddb create-table --table-name development_files \
            --attribute-definitions AttributeName=content_hash,AttributeType=S \
            --key-schema AttributeName=content_hash,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST > /dev/null
          ddb create-table --table-name development_deployment_files \
            --attribute-definitions AttributeName=deployment_id,AttributeType=S AttributeName=path,AttributeType=S \
            --key-schema AttributeName=deployment_id,KeyType=HASH AttributeName=path,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST > /dev/null
          ddb list-tables --output text

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup
        run: pnpm run setup
        env:
          BUILD_MODE: production

      - name: Test
        run: pnpm run test:integration --shard=${{ matrix.shard }}/3

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      API_BASE_URL: http://localhost:3000
      NODE_ENV: test
      TZ: UTC

    services:
      redis:
        image: redis:6-alpine
        ports:
          - 6380:6379
      postgres:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
      # Named after the host in `AMQP_URL` below: the web server runs inside
      # the Playwright container and reaches services by their label.
      rabbitmq:
        image: rabbitmq:4.2-alpine
        ports:
          - 5672:5672

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On the services' network: the web server and the browser both run in
      # the Playwright container below.
      - name: Start S3
        id: s3
        uses: ./.github/actions/start-s3
        with:
          network: ${{ job.services.postgres.network }}

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup
        run: pnpm run setup
        env:
          BUILD_MODE: production

      - name: Run Playwright tests
        uses: docker://mcr.microsoft.com/playwright:v1.62.0-jammy
        with:
          # HOME=/root avoids Firefox permission issues:
          # https://github.com/microsoft/playwright/issues/6500
          args: >-
            env -u CI HOME=/root npm run test:e2e --
            --shard=${{ matrix.shard }}/3 --retries=2 --forbid-only
        env:
          REDIS_URL: redis://redis:6379/1
          DATABASE_URL: postgresql://postgres@postgres/test
          AMQP_URL: amqp://rabbitmq
          S3_ENDPOINT: ${{ steps.s3.outputs.endpoint }}
          S3_FORCE_PATH_STYLE: "true"
          AWS_ENDPOINT_URL_S3: ${{ steps.s3.outputs.endpoint }}

  storybook-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NODE_ENV: test
      TZ: UTC

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup
        run: pnpm run build
        env:
          BUILD_MODE: production

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook tests
        run: env -u CI pnpm --dir apps/frontend run test-storybook --run

  # One status to require in branch protection.
  checks:
    runs-on: ubuntu-latest
    needs:
      [static-analysis, unit-test, integration-test, e2e-test, storybook-test]
    if: ${{ always() }}

    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "At least one job did not succeed: $RESULTS"
              exit 1
            fi
          done
